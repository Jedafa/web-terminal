<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Web Terminal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0a0b'/><path d='M22 32 L42 50 L22 68' stroke='%2334d399' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/><line x1='50' y1='70' x2='78' y2='70' stroke='%2334d399' stroke-width='9' stroke-linecap='round'/></svg>" />
  <link rel="stylesheet" href="vendor/xterm.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Auth overlay -->
  <div id="auth" class="auth hidden">
    <form id="auth-form" class="auth-card">
      <div class="auth-head">
        <svg class="auth-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <h1>Терминал защищён паролем</h1>
      </div>
      <label for="auth-pass">Введите пароль (WEB_TERMINAL_PASSWORD на сервере)</label>
      <input id="auth-pass" type="password" autocomplete="current-password" placeholder="••••••••" autofocus />
      <p id="auth-error" class="auth-error hidden">Неверный пароль</p>
      <p id="auth-hint" class="auth-hint">После входа выдаётся HttpOnly cookie-сессия: пароль не хранится в браузере.</p>
      <button type="submit" class="btn btn-primary btn-block">Войти</button>
    </form>
  </div>

  <!-- Main UI -->
  <div id="app" class="app hidden">
    <header class="header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        <span class="brand-name">Web Terminal</span>
      </div>
      <div class="status" role="status" aria-live="polite">
        <span id="status-dot" class="dot dot-amber"></span>
        <span id="status-text">подключение…</span>
      </div>
      <span id="host-badge" class="host-badge hidden"></span>
      <div class="header-actions">
        <button id="btn-clear" class="btn btn-ghost" title="Очистить экран">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
          <span class="hide-sm">Очистить</span>
        </button>
        <button id="btn-newshell" class="btn btn-primary" title="Перезапустить shell">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          <span class="hide-sm">Новый shell</span>
        </button>
        <button id="btn-logout" class="btn btn-ghost" title="Выйти (сбросить cookie-сессию)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span class="hide-sm">Выйти</span>
        </button>
      </div>
    </header>

    <nav class="tabbar" role="tablist" id="tabbar">
      <div id="tabs" class="tabs"></div>
      <div class="tab-tools">
        <select id="shell-select" class="shell-select" aria-label="Shell для новой вкладки">
          <option value="">shell: default</option>
        </select>
        <button id="btn-addtab" class="btn btn-ghost btn-small">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          вкладка
        </button>
      </div>
    </nav>

    <div class="quickbar hide-sm" id="quickbar">
      <span class="quickbar-label">быстрые:</span>
      <!-- quick command buttons injected by app.js -->
    </div>

    <main class="term-area" id="term-area"></main>
  </div>

  <script src="vendor/socket.io.min.js"></script>
  <script src="vendor/xterm.min.js"></script>
  <script src="vendor/addon-fit.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
