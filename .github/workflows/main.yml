name: Linux SSH Tunnel

on:
  workflow_dispatch:

concurrency:
  group: localport-ssh-tunnel
  cancel-in-progress: false

jobs:
  ssh-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install SSH server
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            openssh-server \
            openssl \
            curl \
            iproute2 \
            procps

      - name: Generate root password and configure SSH
        shell: bash
        run: |
          set -e

          ROOT_PASSWORD="$(openssl rand -hex 24)"

          # Print the password to the GitHub Actions log.
          echo "========================================"
          echo "SSH ROOT PASSWORD: ${ROOT_PASSWORD}"
          echo "SSH USERNAME: root"
          echo "SSH PORT: 3000"
          echo "========================================"

          printf 'root:%s\n' "$ROOT_PASSWORD" | sudo chpasswd

          sudo mkdir -p /run/sshd /etc/ssh/sshd_config.d

          sudo tee /etc/ssh/sshd_config.d/99-github-runner.conf >/dev/null <<'EOF'
          PermitRootLogin yes
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          Port 3000
          UsePAM yes
          EOF

          sudo ssh-keygen -A
          sudo /usr/sbin/sshd -t
          sudo /usr/sbin/sshd

          echo "Waiting for SSH..."
          for i in $(seq 1 15); do
            if sudo ss -lnt | grep -q ':3000'; then
              echo "SSH is listening on port 3000."
              exit 0
            fi
            sleep 1
          done

          echo "ERROR: SSH did not start."
          sudo journalctl -u ssh --no-pager -n 50 || true
          exit 1

      - name: Install Localport
        shell: bash
        run: |
          set -e
          curl -fsSL https://localport.io/install.sh | sh

          if ! command -v localport >/dev/null 2>&1; then
            echo "Localport executable not found in PATH."
            find "$HOME" /usr/local/bin -type f -name localport 2>/dev/null || true
            exit 1
          fi

          localport --help || true

      - name: Start TCP tunnel
        shell: bash
        env:
          LOCALPORT_TOKEN: ${{ secrets.LOCALPORT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${LOCALPORT_TOKEN:-}" ]; then
            echo "ERROR: Add LOCALPORT_TOKEN in Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "Starting Localport TCP tunnel..."
          echo "Target: localhost:3000"
          echo "Region: eu"

          # Do not print the token.
          export NO_COLOR=1
          export TERM=dumb

          localport tcp 3000 --token "$LOCALPORT_TOKEN" --region eu &
          TUNNEL_PID=$!

          cleanup() {
            kill "$TUNNEL_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Tunnel process started. Waiting for connection..."
          echo "If connection succeeds, use the displayed hostname and port."

          wait "$TUNNEL_PID"
