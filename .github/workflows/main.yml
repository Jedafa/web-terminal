name: Temporary Linux SSH Server

on:
  workflow_dispatch:

# Не допускаем параллельных запусков этого workflow.
concurrency:
  group: localport-ssh-tunnel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ssh-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install and configure SSH
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            openssh-server openssl curl

          ROOT_PASSWORD="$(openssl rand -hex 24)"

          echo "root:${ROOT_PASSWORD}" | sudo chpasswd

          sudo mkdir -p /run/sshd /etc/ssh/sshd_config.d

          sudo tee /etc/ssh/sshd_config.d/99-github-runner.conf >/dev/null <<'EOF'
          PermitRootLogin yes
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          Port 3000
          EOF

          sudo sshd -t
          sudo systemctl restart ssh
          sudo systemctl is-active --quiet ssh

          # Keep the generated password available only to this job.
          printf '%s' "$ROOT_PASSWORD" > "$RUNNER_TEMP/ssh_root_password"
          chmod 600 "$RUNNER_TEMP/ssh_root_password"

          # Mask the password in workflow logs.
          echo "::add-mask::${ROOT_PASSWORD}"

          echo "SSH server started on local port 3000."

      - name: Install Localport
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://localport.io/install.sh \
            -o "$RUNNER_TEMP/localport-install.sh"

          sudo sh "$RUNNER_TEMP/localport-install.sh"
          rm -f "$RUNNER_TEMP/localport-install.sh"

          if ! command -v localport >/dev/null 2>&1; then
            echo "ERROR: Localport executable not found."
            exit 1
          fi

          echo "Localport installed."

      - name: Start Localport exactly once
        shell: bash
        env:
          LOCALPORT_TOKEN: ${{ secrets.LOCALPORT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${LOCALPORT_TOKEN:-}" ]; then
            echo "ERROR: LOCALPORT_TOKEN secret is missing."
            exit 1
          fi

          echo "Starting one Localport session."
          echo "Local TCP port: 3000"
          echo "Region: eu"
          echo "Automatic retries: disabled"

          # No background process, retry loop, or second invocation.
          # Localport receives its token through the environment.
          exec localport tcp 3000 --region eu
