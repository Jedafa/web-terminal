name: Temporary Linux SSH Server

on:
  workflow_dispatch:

concurrency:
  group: localport-ssh-tunnel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ssh-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install and configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========== SYSTEM =========="
          date -u
          uname -a
          df -h /
          free -h || true

          echo "========== INSTALL SSH =========="

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            openssh-server openssl curl iproute2 procps

          ROOT_PASSWORD="$(openssl rand -hex 24)"

          # Mask password in workflow logs.
          echo "::add-mask::${ROOT_PASSWORD}"

          echo "root:${ROOT_PASSWORD}" | sudo chpasswd

          sudo mkdir -p /run/sshd
          sudo mkdir -p /etc/ssh/sshd_config.d

          sudo tee /etc/ssh/sshd_config.d/99-github-runner.conf >/dev/null <<'EOF'
          PermitRootLogin yes
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          Port 3000
          EOF

          sudo sshd -t
          sudo systemctl enable ssh
          sudo systemctl restart ssh

          sudo systemctl is-active --quiet ssh

          if ! sudo ss -lnt | grep -E '[:.]3000[[:space:]]'; then
            echo "ERROR: SSH port 3000 is not listening."
            exit 1
          fi

          # Save credentials for the tunnel step.
          printf '%s' "$ROOT_PASSWORD" > "$RUNNER_TEMP/ssh_root_password"
          chmod 600 "$RUNNER_TEMP/ssh_root_password"

          # Keep password available for the summary.
          unset ROOT_PASSWORD

          echo "SSH started successfully on port 3000."

      - name: Install Localport
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========== INSTALL LOCALPORT =========="

          curl -fsSL https://localport.io/install.sh \
            -o "$RUNNER_TEMP/localport-install.sh"

          sudo sh "$RUNNER_TEMP/localport-install.sh"
          rm -f "$RUNNER_TEMP/localport-install.sh"

          if ! command -v localport >/dev/null 2>&1; then
            echo "ERROR: localport executable not found."
            exit 1
          fi

          localport version

      - name: Start tunnel and publish connection details
        shell: bash
        env:
          LOCALPORT_TOKEN: ${{ secrets.LOCALPORT_TOKEN }}
        run: |
          set -Eeuo pipefail

          echo "========== TUNNEL DIAGNOSTICS =========="

          if [ -z "${LOCALPORT_TOKEN:-}" ]; then
            echo "ERROR: LOCALPORT_TOKEN secret is missing."
            exit 1
          fi

          if [ ! -s "$RUNNER_TEMP/ssh_root_password" ]; then
            echo "ERROR: SSH password file is missing."
            exit 1
          fi

          # Localport requires a private token file.
          TOKEN_FILE="$RUNNER_TEMP/localport-token"
          LOG_FILE="$RUNNER_TEMP/localport.log"

          umask 077
          printf '%s' "$LOCALPORT_TOKEN" > "$TOKEN_FILE"
          chmod 600 "$TOKEN_FILE"
          unset LOCALPORT_TOKEN

          export LOCALPORT_TOKEN_FILE="$TOKEN_FILE"
          export NO_COLOR=1
          export TERM=dumb

          : > "$LOG_FILE"
          chmod 600 "$LOG_FILE"

          echo "Local SSH port: 3000"
          echo "Region: eu"
          echo "Automatic retries: disabled"
          echo "Tunnel invocations: one"
          echo "Waiting for Localport to report the public address..."

          # Launch exactly one Localport process.
          localport tcp 3000 --region eu --noui \
            > >(tee -a "$LOG_FILE") 2>&1 &
          TUNNEL_PID=$!

          cleanup() {
            kill "$TUNNEL_PID" 2>/dev/null || true
            wait "$TUNNEL_PID" 2>/dev/null || true
            rm -f "$TOKEN_FILE"
          }

          trap cleanup EXIT INT TERM

          ADDRESS=""
          PASSWORD="$(cat "$RUNNER_TEMP/ssh_root_password")"

          # Wait for the actual forwarding address or process exit.
          # This loop does not restart Localport.
          while kill -0 "$TUNNEL_PID" 2>/dev/null; do
            if grep -q 'connected .*tcp://' "$LOG_FILE"; then
              ADDRESS="$(
                sed -nE \
                  's/.*connected .*tcp:\/\/([^[:space:]]+).*/\1/p' \
                  "$LOG_FILE" | tail -n 1
              )"

              if [[ "$ADDRESS" =~ ^[A-Za-z0-9.-]+:[0-9]+$ ]]; then
                break
              fi
            fi

            sleep 1
          done

          if [ -n "$ADDRESS" ]; then
            SSH_HOST="${ADDRESS%:*}"
            SSH_PORT="${ADDRESS##*:}"

            echo
            echo "========== SSH CONNECTION DETAILS =========="
            echo "Host: $SSH_HOST"
            echo "Port: $SSH_PORT"
            echo "Username: root"
            echo "Password: [hidden in logs]"
            echo

            {
              echo "## SSH Connection Details"
              echo
              echo "The Localport tunnel reported a public address."
              echo
              echo '```text'
              echo "Host: ${SSH_HOST}"
              echo "Port: ${SSH_PORT}"
              echo "Username: root"
              echo "Password: ${PASSWORD}"
              echo '```'
              echo
              echo "Connect with:"
              echo
              echo '```bash'
              printf 'ssh root@%s -p %s\n' "$SSH_HOST" "$SSH_PORT"
              echo '```'
              echo
              echo "Keep these credentials private."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ERROR: Localport exited before reporting a valid address."
            echo "Review the Localport output above."

            {
              echo "## Tunnel startup failed"
              echo
              echo "No valid forwarding address was detected."
              echo "Review the workflow logs for the Localport error."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Keep the tunnel alive; never start a second process.
          set +e
          wait "$TUNNEL_PID"
          EXIT_CODE=$?
          set -e

          echo "========== LOCALPORT EXIT =========="
          echo "Exit code: $EXIT_CODE"
          date -u

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "ERROR: Localport exited with an error."
            exit "$EXIT_CODE"
          fi

          echo "Localport exited normally."
