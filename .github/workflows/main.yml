name: Temporary Linux SSH Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install and configure SSH
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing OpenSSH..."

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            openssh-server \
            curl \
            openssl

          echo "Generating random root password..."
          ROOT_PASSWORD="$(openssl rand -hex 24)"

          echo "root:${ROOT_PASSWORD}" | sudo chpasswd

          sudo mkdir -p /run/sshd
          sudo mkdir -p /etc/ssh/sshd_config.d

          sudo tee /etc/ssh/sshd_config.d/99-github-runner.conf >/dev/null <<'EOF'
          PermitRootLogin yes
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          Port 3000
          EOF

          sudo sshd -t

          sudo systemctl enable ssh
          sudo systemctl restart ssh

          if ! sudo systemctl is-active --quiet ssh; then
            echo "SSH service failed to start."
            sudo journalctl -u ssh --no-pager -n 50
            exit 1
          fi

          {
            echo "## SSH server"
            echo
            echo "- Username: root"
            echo "- SSH port: 3000"
            echo
            echo "The password is available in the step logs."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "SSH service is running."

          # Mask the password in GitHub Actions logs.
          echo "::add-mask::${ROOT_PASSWORD}"

          # Store credentials for the tunnel step without printing the password.
          printf '%s' "$ROOT_PASSWORD" > "$RUNNER_TEMP/ssh_root_password"
          chmod 600 "$RUNNER_TEMP/ssh_root_password"

      - name: Install Localport
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://localport.io/install.sh \
            -o "$RUNNER_TEMP/localport-install.sh"

          sudo sh "$RUNNER_TEMP/localport-install.sh"

          rm -f "$RUNNER_TEMP/localport-install.sh"

          if ! command -v localport >/dev/null 2>&1; then
            echo "Localport executable was not found in PATH."

            if [ -x /usr/local/bin/localport ]; then
              echo "/usr/local/bin/localport exists."
            fi

            exit 1
          fi

          echo "Localport installed successfully."

      - name: Start TCP tunnel
        shell: bash
        env:
          LOCALPORT_TOKEN: ${{ secrets.LOCALPORT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${LOCALPORT_TOKEN:-}" ]; then
            echo "ERROR: Configure LOCALPORT_TOKEN in repository secrets."
            exit 1
          fi

          echo "Starting Localport TCP tunnel..."
          echo "Local SSH port: 3000"
          echo "Region: eu"

          localport tcp 3000 \
            --token "$LOCALPORT_TOKEN" \
            --region eu &
          
          TUNNEL_PID=$!

          cleanup() {
            kill "$TUNNEL_PID" 2>/dev/null || true
          }

          trap cleanup EXIT INT TERM

          while kill -0 "$TUNNEL_PID" 2>/dev/null; do
            sleep 5
          done

          echo "ERROR: Localport stopped."
          wait "$TUNNEL_PID"
