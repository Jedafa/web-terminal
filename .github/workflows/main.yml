name: Temporary Linux SSH Server

on:
  workflow_dispatch:

concurrency:
  group: localport-ssh-tunnel
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ssh-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install and configure SSH
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing OpenSSH..."

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            openssh-server \
            curl \
            openssl

          ROOT_PASSWORD="$(openssl rand -hex 24)"

          echo "root:${ROOT_PASSWORD}" | sudo chpasswd

          sudo mkdir -p /run/sshd
          sudo mkdir -p /etc/ssh/sshd_config.d

          sudo tee /etc/ssh/sshd_config.d/99-github-runner.conf >/dev/null <<'EOF'
          PermitRootLogin yes
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          Port 3000
          EOF

          sudo sshd -t
          sudo systemctl enable ssh
          sudo systemctl restart ssh

          if ! sudo systemctl is-active --quiet ssh; then
            echo "SSH failed to start."
            sudo journalctl -u ssh --no-pager -n 50
            exit 1
          fi

          echo "::add-mask::${ROOT_PASSWORD}"

          # Keep the password available to later steps.
          printf '%s' "$ROOT_PASSWORD" > "$RUNNER_TEMP/ssh_root_password"
          chmod 600 "$RUNNER_TEMP/ssh_root_password"

          {
            echo "## SSH server"
            echo
            echo "Username: root"
            echo "SSH local port: 3000"
            echo
            echo "The randomly generated password is masked in the logs."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "SSH is running on port 3000."

      - name: Install Localport
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://localport.io/install.sh \
            -o "$RUNNER_TEMP/localport-install.sh"

          sudo sh "$RUNNER_TEMP/localport-install.sh"
          rm -f "$RUNNER_TEMP/localport-install.sh"

          if ! command -v localport >/dev/null 2>&1; then
            echo "ERROR: localport executable not found in PATH."

            if [ -x /usr/local/bin/localport ]; then
              echo "Executable exists at /usr/local/bin/localport."
            fi

            exit 1
          fi

          echo "Localport installed."

      - name: Start TCP tunnel
        shell: bash
        env:
          LOCALPORT_TOKEN: ${{ secrets.LOCALPORT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${LOCALPORT_TOKEN:-}" ]; then
            echo "ERROR: LOCALPORT_TOKEN secret is missing."
            exit 1
          fi

          # Avoid exposing the token as a command-line argument.
          export LOCALPORT_TOKEN

          echo "Starting Localport TCP tunnel..."
          echo "Local SSH port: 3000"
          echo "Region: eu"

          localport tcp 3000 \
            --region eu &
          TUNNEL_PID=$!

          cleanup() {
            kill "$TUNNEL_PID" 2>/dev/null || true
            wait "$TUNNEL_PID" 2>/dev/null || true
          }

          trap cleanup EXIT INT TERM

          # Keep the job alive while the tunnel is running.
          while kill -0 "$TUNNEL_PID" 2>/dev/null; do
            sleep 5
          done

          echo "ERROR: Localport stopped."
          wait "$TUNNEL_PID"
